<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaganat - Каганат</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            margin: 0;
            background-color: #050505;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .screen {
            display: none;
            width: 380px;
            background: #111726;
            padding: 35px;
            border-radius: 14px;
            border: 2px solid #c28e38;
            box-shadow: 0 0 25px rgba(194, 142, 56, 0.2);
            text-align: center;
        }
        .screen.active {
            display: block;
        }
        /* Экран загрузки */
        #loader-screen img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }
        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: #05070a;
            border-radius: 5px;
            border: 1px solid #c28e38;
            overflow: hidden;
            margin-top: 15px;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #c28e38, #f3d078);
            transition: width 0.05s linear;
        }
        .progress-text {
            margin-top: 10px;
            font-size: 14px;
            color: #b0b0b0;
        }
        /* Формы */
        h2 {
            margin-top: 0;
            color: #f3d078;
            margin-bottom: 25px;
            font-size: 22px;
        }
        .input-group {
            text-align: left;
            margin-bottom: 15px;
            position: relative;
        }
        label {
            display: block;
            font-size: 13px;
            color: #cfd8dc;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #080b12;
            border: 1px solid #3a475d;
            color: #fff;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #c28e38;
        }
        input.error-input {
            border-color: #ff4d4d !important;
            box-shadow: 0 0 8px rgba(255, 77, 77, 0.4);
        }
        .field-error-text {
            display: none;
            color: #ff4d4d;
            font-size: 11px;
            margin-top: 4px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #c28e38;
            color: #080b12;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #d4a04d;
        }
        .btn-google {
            background: #ffffff;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }
        .btn-google:hover {
            background: #e0e0e0;
        }
        .switch-link {
            margin-top: 20px;
            font-size: 14px;
            color: #b0b0b0;
            cursor: pointer;
        }
        .switch-link span {
            color: #f3d078;
            text-decoration: underline;
        }

        /* МОДАЛЬНОЕ ОКНО ОШИБКИ */
        #error-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #111726;
            padding: 25px;
            border-radius: 12px;
            border: 2px solid #ff4d4d;
            width: 320px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 77, 77, 0.3);
        }
        .modal-content h3 {
            color: #ff4d4d;
            margin-top: 0;
            margin-bottom: 10px;
        }
        .modal-content p {
            color: #ddd;
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 20px;
        }
        .modal-btn {
            background: #ff4d4d;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .modal-btn:hover {
            background: #ff3333;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
    </style>
</head>
<body>

    <!-- 1. ЭКРАН ЗАГРУЗКИ -->
    <div id="loader-screen" class="screen active">
        <img src="logo.png" alt="Kaganat Logo" onerror="this.style.display='none'">
        <h2 style="margin-bottom:5px;">КАГАНАТ</h2>
        <div class="progress-text" id="loadStatus">Жүктөлүүдө... 0%</div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <!-- 2. ЭКРАН ВХОДА -->
    <div id="login-screen" class="screen">
        <h2>Кирүү</h2>
        <div class="input-group">
            <label>Ысым</label>
            <input type="text" id="loginNickname" placeholder="Ысымыңызды жазыңыз">
            <div class="field-error-text" id="loginNicknameError"></div>
        </div>
        <div class="input-group">
            <label>Сыр сөз</label>
            <input type="password" id="loginPassword" placeholder="Сыр сөзүңүздү жазыңыз">
            <div class="field-error-text" id="loginPasswordError"></div>
        </div>
        <button class="btn" id="loginBtn">Кирүү</button>
        <div class="switch-link" onclick="switchScreen('register-screen')">
            Аккаунт жокпу? <span style="font-weight: bold;">Катталуу</span>
        </div>
    </div>

    <!-- 3. ЭКРАН КАТТАЛУУ (РЕГИСТРАЦИИ) -->
    <div id="register-screen" class="screen">
        <h2>Катталуу</h2>
        <div class="input-group">
            <label>Ысым ойлоп табыңыз</label>
            <input type="text" id="regNickname" placeholder="Уникалдуу ысым">
            <div class="field-error-text" id="regNicknameError"></div>
        </div>
        <div class="input-group">
            <label>Сыр сөз ойлоп табыңыз</label>
            <input type="password" id="regPassword" placeholder="Латын тамгалары, сандар (мин. 8)">
            <div class="field-error-text" id="regPasswordError"></div>
        </div>
        <div class="input-group">
            <label>Сыр сөзүңүздү кайталап жазыңыз</label>
            <input type="password" id="regPasswordConfirm" placeholder="Сыр сөздү кайталаңыз">
            <div class="field-error-text" id="regPasswordConfirmError"></div>
        </div>
        
        <button class="btn btn-google" id="googleBindBtn">
            <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.86 2.07-1.83 2.71v2.26h2.96c1.73-1.59 2.73-3.93 2.73-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.96-2.26c-.8.54-1.82.87-3 .87-2.3 0-4.25-1.55-4.95-3.64H1.02v2.33C2.55 15.96 5.54 18 9 18z"/><path fill="#FBBC05" d="M4.05 10.79c-.18-.54-.28-1.12-.28-1.79s.1-1.25.28-1.79V4.88H1.02C.37 6.18 0 7.65 0 9.2s.37 3.02 1.02 4.32l3.03-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.47.89 11.43 0 9 0 5.54 0 2.55 2.04 1.02 4.88l3.03 2.33c.7-2.09 2.65-3.63 4.95-3.63z"/></svg>
            Google аккаунтту байлоо
        </button>

        <button class="btn" id="registerSubmitBtn" style="margin-top: 15px;">Катталууну аяктоо</button>
        
        <div class="switch-link" onclick="switchScreen('login-screen')">
            Мурунтан аккаунтуңуз барбы? <span style="font-weight: bold;">Кирүү</span>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ОШИБКИ -->
    <div id="error-modal">
        <div class="modal-content">
            <h3>Маалыматтар ката</h3>
            <p id="error-message">Сураныч, маалыматтарды туура толтуруңуз!</p>
            <button class="modal-btn" onclick="closeErrorModal()">Макул</button>
        </div>
    </div>

    <!-- СКРИПТ ЛОГИКИ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBRkzOUhINImQi69kBdElZhyOmMCUlDNnQ",
            authDomain: "kaganat-5c070.firebaseapp.com",
            projectId: "kaganat-5c070",
            storageBucket: "kaganat-5c070.appspot.com",
            messagingSenderId: "601843425761",
            appId: "1:601843425761:web:429cd2775df0661543f2a0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.switchScreen = function(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            clearErrors();
        }

        window.clearErrors = function() {
            document.querySelectorAll('input').forEach(input => input.classList.remove('error-input'));
            document.querySelectorAll('.field-error-text').forEach(el => {
                el.innerText = '';
                el.style.display = 'none';
            });
        }

        window.showError = function(msg, fieldErrors = {}) {
            document.getElementById('error-message').innerText = msg;
            document.getElementById('error-modal').style.display = 'flex';
            
            for (const [id, errorText] of Object.entries(fieldErrors)) {
                const el = document.getElementById(id);
                if(el) el.classList.add('error-input');
                
                const errDiv = document.getElementById(id + 'Error');
                if(errDiv && errorText) {
                    errDiv.innerText = errorText;
                    errDiv.style.display = 'block';
                }
            }
        }

        window.closeErrorModal = function() {
            document.getElementById('error-modal').style.display = 'none';
        }

        // Анимация загрузки
        let progress = 0;
        const progressBar = document.getElementById('progressBar');
        const loadStatus = document.getElementById('loadStatus');

        const loadingInterval = setInterval(() => {
            progress += 3;
            if (progress >= 100) {
                progress = 100;
                clearInterval(loadingInterval);
                setTimeout(() => {
                    switchScreen('login-screen');
                }, 300);
            }
            progressBar.style.width = progress + '%';
            loadStatus.innerText = `Жүктөлүүдө... ${progress}%`;
        }, 30);

        // Кнопка Входа
        document.getElementById('loginBtn').addEventListener('click', async () => {
            clearErrors();
            const nick = document.getElementById('loginNickname').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();

            let errors = {};
            if(!nick) errors['loginNickname'] = 'Ысымды жазыңыз';
            if(!pass) errors['loginPassword'] = 'Сыр сөздү жазыңыз';

            if(Object.keys(errors).length > 0) {
                showError('Сураныч, бардык талааларды толтуруңуз!', errors);
                return;
            }

            try {
                const nicknameKey = nick.toLowerCase();
                const userDocRef = doc(db, "nicknames", nicknameKey);
                const userSnap = await getDoc(userDocRef);

                if(!userSnap.exists()) {
                    showError('Мындай ысым катталган эмес!', {'loginNickname': 'Катталбаган ысым'});
                    return;
                }

                const userData = userSnap.data();
                if(userData.password !== pass) {
                    showError('Сыр сөз ката жазылды!', {'loginPassword': 'Сыр сөз туура эмес'});
                    return;
                }

                alert('Ийгиликтүү кирдиңиз!');
            } catch (e) {
                console.error(e);
                showError('Туура эмес маалыматтарды жаздыңыз!', {'loginNickname': '', 'loginPassword': ''});
            }
        });

        // Кнопка Google привязки через Popup (всплывающее окно)
        document.getElementById('googleBindBtn').addEventListener('click', async () => {
            const provider = new GoogleAuthProvider();
            try {
                const result = await signInWithPopup(auth, provider);
                alert('Google аккаунт ийгиликтүү байланды: ' + result.user.email);
            } catch (error) {
                console.error(error);
                showError('Google аркылуу кирүү ката кетти!');
            }
        });

        // Кнопка Регистрации
        document.getElementById('registerSubmitBtn').addEventListener('click', async () => {
            clearErrors();
            const nick = document.getElementById('regNickname').value.trim();
            const pass1 = document.getElementById('regPassword').value;
            const pass2 = document.getElementById('regPasswordConfirm').value;

            let errors = {};
            if(!nick) errors['regNickname'] = 'Ысымды толтуруңуз';
            if(!pass1) errors['regPassword'] = 'Сыр сөздү толтуруңуз';
            if(!pass2) errors['regPasswordConfirm'] = 'Сыр сөздү кайталаңыз';

            if(Object.keys(errors).length > 0) {
                showError('Бардык талааларды толтуруу зарыл!', errors);
                return;
            }

            if(nick.length < 3) {
                showError('Ысым эң аз 3 символдон турушу керек!', {'regNickname': 'Кем дегенде 3 символ'});
                return;
            }

            const englishOnlyRegex = /^[A-Za-z0-9]+$/;
            const hasLetter = /[A-Za-z]/.test(pass1);
            const hasNumber = /[0-9]/.test(pass1);

            if (pass1.length < 8) {
                showError('Сыр сөздө эң аз 8 символ болушу керек!', {'regPassword': 'Эң аз 8 символ болушу керек', 'regPasswordConfirm': ''});
                return;
            }

            if (!englishOnlyRegex.test(pass1) || !hasLetter || !hasNumber) {
                showError('Сыр сөздө латын тамгалары жана сандар болушу зарыл!', {'regPassword': 'Латын тамгалары жана сандар катышыш керек', 'regPasswordConfirm': ''});
                return;
            }

            if(pass1 !== pass2) {
                showError('Сыр сөздөр бири-бирине дал келбейт!', {'regPassword': 'Дал келбейт', 'regPasswordConfirm': 'Сыр сөздөр бирдей болушу шарт'});
                return;
            }

            try {
                const nicknameKey = nick.toLowerCase();
                const nickRef = doc(db, "nicknames", nicknameKey);
                const nickSnap = await getDoc(nickRef);

                if (nickSnap.exists()) {
                    showError('Бул ысым буга чейин алынган!', {'regNickname': 'Бул ысым бош эмес'});
                    return;
                }

                await setDoc(nickRef, { 
                    nickname: nick,
                    password: pass1 
                });

                alert('Катталуу ийгиликтүү аяктады! Эми кире аласыз.');
                switchScreen('login-screen');

            } catch (error) {
                console.error(error);
                showError('Каттоо учурунда ката кетти!');
            }
        });
    </script>
</body>
</html>
