<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kaganat - Каганат</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            background: #080604;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 15px;
        }
        .screen {
            display: none;
            width: 100%;
            max-width: 440px;
            background: radial-gradient(circle at center, #2e1c0c 0%, #160d06 100%);
            padding: 30px;
            border-radius: 14px;
            border: 2px solid #d49a3d;
            box-shadow: 0 0 45px rgba(212, 154, 61, 0.25), inset 0 0 25px rgba(0, 0, 0, 0.6);
            text-align: center;
        }
        .screen.active {
            display: block;
        }
        #faction-screen {
            max-width: 820px;
            padding: 25px 30px;
        }
        .screen-logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 12px;
        }
        #loader-screen img {
            animation: pulse 1.5s infinite;
        }
        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: #0c0804;
            border-radius: 5px;
            border: 1px solid #d49a3d;
            overflow: hidden;
            margin-top: 15px;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #d49a3d, #ffd479);
            transition: width 0.05s linear;
        }
        .progress-text {
            margin-top: 10px;
            font-size: 14px;
            color: #d1b48c;
        }
        h2 {
            margin-top: 0;
            color: #ffd479;
            margin-bottom: 15px;
            font-size: 22px;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        }
        .input-group {
            text-align: left;
            margin-bottom: 15px;
            position: relative;
        }
        label {
            display: block;
            font-size: 13px;
            color: #ecd7ba;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #0f0a06;
            border: 1px solid #5a3e1b;
            color: #fff;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #ffd479;
        }
        input.error-input {
            border-color: #ff4d4d !important;
            box-shadow: 0 0 8px rgba(255, 77, 77, 0.4);
        }
        .field-error-text {
            display: none;
            color: #ff6b6b;
            font-size: 11px;
            margin-top: 4px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(180deg, #e6a745, #b87a28);
            color: #1a0f05;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }
        .btn:hover {
            background: linear-gradient(180deg, #f5b758, #c98934);
        }
        .btn-google {
            background: #ffffff;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }
        .btn-google:hover {
            background: #e0e0e0;
        }
        .switch-link {
            margin-top: 20px;
            font-size: 14px;
            color: #cfb395;
            cursor: pointer;
        }
        .switch-link span {
            color: #ffd479;
            text-decoration: underline;
        }

        /* БЛОК ВЫБОРА ФРАКЦИИ (ПК) */
        .faction-warning {
            font-size: 13px;
            color: #f3dfc8;
            margin-bottom: 20px;
            background: rgba(12, 7, 3, 0.6);
            padding: 10px 16px;
            border-radius: 6px;
            border: 1px solid #784e1b;
        }
        .factions-container {
            display: flex;
            justify-content: center;
            gap: 25px;
        }
        .faction-card {
            flex: 1;
            background: radial-gradient(circle at 50% 30%, #4a2c11 0%, #241407 100%);
            border: 2px solid #b87a28;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.7), 0 6px 15px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s;
        }
        .faction-card:hover {
            transform: translateY(-4px);
        }
        .faction-img-wrap {
            width: 100%;
            height: 380px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin-bottom: 15px;
            position: relative;
        }
        .faction-img-wrap img {
            height: 100%;
            max-width: 100%;
            object-fit: contain;
            transform: scale(1.6);
            transform-origin: bottom center;
            image-rendering: pixelated;
            filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.8));
        }
        .btn-kyrgyz {
            width: 100%;
            padding: 13px;
            background: linear-gradient(180deg, #d32f2f, #9a1919);
            color: #ffffff;
            border: 1px solid #ff7b7b;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(211, 47, 47, 0.4);
            transition: all 0.2s;
        }
        .btn-kypchak {
            width: 100%;
            padding: 13px;
            background: linear-gradient(180deg, #1976d2, #0d47a1);
            color: #ffffff;
            border: 1px solid #64b5f6;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(25, 118, 210, 0.4);
            transition: all 0.2s;
        }

        /* ПОЛНАЯ АДАПТАЦИЯ ДЛЯ ТЕЛЕФОНОВ: КАРТОЧКИ В СТОЛБЕЦ */
        @media (max-width: 650px) {
            body {
                align-items: flex-start;
                padding: 10px;
            }
            .screen {
                padding: 18px 14px;
                border-radius: 12px;
                margin-top: 10px;
                margin-bottom: 20px;
            }
            #faction-screen {
                padding: 16px 12px;
            }
            .factions-container {
                flex-direction: column; /* Карточки встают друг под друга! */
                gap: 20px;
            }
            .faction-card {
                width: 100%;
                padding: 15px;
            }
            .faction-img-wrap {
                height: 280px;
                margin-bottom: 12px;
            }
            .faction-img-wrap img {
                transform: scale(1.65); /* Воины становятся огромными и четкими */
                transform-origin: bottom center;
            }
            .btn-kyrgyz, .btn-kypchak {
                padding: 12px;
                font-size: 16px;
            }
        }

        /* УНИВЕРСАЛЬНОЕ МОДАЛЬНОЕ ОКНО */
        #custom-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 15px;
        }
        .modal-content {
            background: #241407;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
        }
        .modal-content h3 {
            margin-top: 0;
            margin-bottom: 10px;
        }
        .modal-content p {
            color: #f3dfc8;
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 20px;
        }
        .modal-btn {
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .modal-error {
            border: 2px solid #ff4d4d;
            box-shadow: 0 0 20px rgba(255, 77, 77, 0.4);
        }
        .modal-error h3 { color: #ff6b6b; }
        .modal-error .modal-btn { background: #d32f2f; }

        .modal-success {
            border: 2px solid #28a745;
            box-shadow: 0 0 20px rgba(40, 167, 69, 0.4);
        }
        .modal-success h3 { color: #4cd169; }
        .modal-success .modal-btn { background: #28a745; }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
    </style>
</head>
<body>

    <!-- 1. ЭКРАН ЗАГРУЗКИ -->
    <div id="loader-screen" class="screen active">
        <img src="logo.png" alt="Kaganat Logo" class="screen-logo" onerror="this.style.display='none'">
        <h2 style="margin-bottom:5px;">КАГАНАТ</h2>
        <div class="progress-text" id="loadStatus">Жүктөлүүдө... 0%</div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <!-- 2. ЭКРАН ВХОДА -->
    <div id="login-screen" class="screen">
        <img src="logo.png" alt="Kaganat Logo" class="screen-logo" onerror="this.style.display='none'">
        <h2>Кирүү</h2>
        <div class="input-group">
            <label>Ысым</label>
            <input type="text" id="loginNickname" placeholder="Ысымыңызды жазыңыз">
            <div class="field-error-text" id="loginNicknameError"></div>
        </div>
        <div class="input-group">
            <label>Сыр сөз</label>
            <input type="password" id="loginPassword" placeholder="Сыр сөзүңүздү жазыңыз">
            <div class="field-error-text" id="loginPasswordError"></div>
        </div>
        <button class="btn" id="loginBtn">Кирүү</button>
        <div class="switch-link" onclick="switchScreen('register-screen')">
            Аккаунт жокпу? <span style="font-weight: bold;">Катталуу</span>
        </div>
    </div>

    <!-- 3. ЭКРАН КАТТАЛУУ (РЕГИСТРАЦИИ) -->
    <div id="register-screen" class="screen">
        <img src="logo.png" alt="Kaganat Logo" class="screen-logo" onerror="this.style.display='none'">
        <h2>Катталуу</h2>
        <div class="input-group">
            <label>Ысым ойлоп табыңыз</label>
            <input type="text" id="regNickname" placeholder="Уникалдуу ысым">
            <div class="field-error-text" id="regNicknameError"></div>
        </div>
        <div class="input-group">
            <label>Сыр сөз ойлоп табыңыз</label>
            <input type="password" id="regPassword" placeholder="Латын тамгалары, сандар (мин. 8)">
            <div class="field-error-text" id="regPasswordError"></div>
        </div>
        <div class="input-group">
            <label>Сыр сөзүңүздү кайталап жазыңыз</label>
            <input type="password" id="regPasswordConfirm" placeholder="Сыр сөздү кайталаңыз">
            <div class="field-error-text" id="regPasswordConfirmError"></div>
        </div>
        
        <button class="btn btn-google" id="googleBindBtn">
            <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.86 2.07-1.83 2.71v2.26h2.96c1.73-1.59 2.73-3.93 2.73-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.96-2.26c-.8.54-1.82.87-3 .87-2.3 0-4.25-1.55-4.95-3.64H1.02v2.33C2.55 15.96 5.54 18 9 18z"/><path fill="#FBBC05" d="M4.05 10.79c-.18-.54-.28-1.12-.28-1.79s.1-1.25.28-1.79V4.88H1.02C.37 6.18 0 7.65 0 9.2s.37 3.02 1.02 4.32l3.03-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.47.89 11.43 0 9 0 5.54 0 2.55 2.04 1.02 4.88l3.03 2.33c.7-2.09 2.65-3.63 4.95-3.63z"/></svg>
            Google аккаунтту байлоо
        </button>

        <button class="btn" id="registerSubmitBtn" style="margin-top: 15px;">Катталууну аяктоо</button>
        
        <div class="switch-link" onclick="switchScreen('login-screen')">
            Мурунтан аккаунтуңуз барбы? <span style="font-weight: bold;">Кирүү</span>
        </div>
    </div>

    <!-- 4. ЭКРАН ВЫБОРА ФРАКЦИИ -->
    <div id="faction-screen" class="screen">
        <h2>Фракцияны тандаңыз</h2>
        <div class="faction-warning">
            Бул тандоо мүнөздөмөлөргө жана оюндун жүрүшүнө таасир этпейт
        </div>
        <div class="factions-container">
            <!-- Карточка Кыргыз -->
            <div class="faction-card">
                <div class="faction-img-wrap">
                    <img src="kyrgyz.png" alt="Кыргыз" onerror="this.src='hero_idle_in.jpg'">
                </div>
                <button class="btn-kyrgyz" id="chooseKyrgyzBtn">Кыргыз</button>
            </div>
            <!-- Карточка Кыпчак -->
            <div class="faction-card">
                <div class="faction-img-wrap">
                    <img src="kypchak.png" alt="Кыпчак" onerror="this.src='Кыпчак прото.jpg'">
                </div>
                <button class="btn-kypchak" id="chooseKypchakBtn">Кыпчак</button>
            </div>
        </div>
    </div>

    <!-- 5. ГЛАВНЫЙ ЭКРАН ИГРЫ (ЛОББИ) -->
    <div id="game-screen" class="screen">
        <h2 id="welcomePlayerTitle">Каганат дүйнөсүнө кош келдиңиз!</h2>
        <p id="playerFactionInfo" style="color: #ffd479; font-weight: bold; font-size: 18px;"></p>
        <p style="color: #ecd7ba; font-size: 14px;">Оюнга даярданыңыз...</p>
        <button class="btn" id="logoutBtn" style="margin-top: 25px; background: #5a201b; color: #fff; border: 1px solid #ff6b6b;">Чыгуу (Аккаунттан чыгуу)</button>
    </div>

    <!-- УНИВЕРСАЛЬНОЕ МОДАЛЬНОЕ ОКНО -->
    <div id="custom-modal">
        <div class="modal-content" id="modal-content-box">
            <h3 id="modal-title">Маалымат</h3>
            <p id="modal-message">Бул жерде текст болот</p>
            <button class="modal-btn" id="modalActionBtn">Макул</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBRkzoUhINimIQ69kBdelZhyoMmCUlDUNQ",
            authDomain: "kaganat-5c070.firebaseapp.com",
            projectId: "kaganat-5c070",
            storageBucket: "kaganat-5c070.firebasestorage.app",
            messagingSenderId: "601843425761",
            appId: "1:601843425761:web:429cd2775df0661543f2a0",
            measurementId: "G-TQCNY6V5Z5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentActiveUser = null;
        let currentSessionId = null;
        let unsubscribeUserListener = null;
        let onModalCloseCallback = null;

        window.switchScreen = function(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            const target = document.getElementById(screenId);
            if (target) target.classList.add('active');
            clearErrors();
        }

        window.clearErrors = function() {
            document.querySelectorAll('input').forEach(input => input.classList.remove('error-input'));
            document.querySelectorAll('.field-error-text').forEach(el => {
                el.innerText = '';
                el.style.display = 'none';
            });
        }

        window.showModal = function(title, msg, type = 'error', fieldErrors = {}, onClose = null) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = msg;
            
            const modalBox = document.getElementById('modal-content-box');
            modalBox.className = 'modal-content ' + (type === 'success' ? 'modal-success' : 'modal-error');
            
            document.getElementById('custom-modal').style.display = 'flex';
            onModalCloseCallback = onClose;
            
            for (const [id, errorText] of Object.entries(fieldErrors)) {
                const el = document.getElementById(id);
                if(el) el.classList.add('error-input');
                
                const errDiv = document.getElementById(id + 'Error');
                if(errDiv && errorText) {
                    errDiv.innerText = errorText;
                    errDiv.style.display = 'block';
                }
            }
        }

        document.getElementById('modalActionBtn').addEventListener('click', () => {
            document.getElementById('custom-modal').style.display = 'none';
            if (typeof onModalCloseCallback === 'function') {
                const cb = onModalCloseCallback;
                onModalCloseCallback = null;
                cb();
            }
        });

        // Слушатель для мгновенного выбивания старого устройства
        function listenForRemoteSession(nicknameKey) {
            if (unsubscribeUserListener) {
                unsubscribeUserListener();
            }

            const userRef = doc(db, "nicknames", nicknameKey);
            unsubscribeUserListener = onSnapshot(userRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    // Если в базе сессия изменилась другим устройством
                    if (data.currentSessionId && currentSessionId && data.currentSessionId !== currentSessionId) {
                        if (unsubscribeUserListener) {
                            unsubscribeUserListener();
                            unsubscribeUserListener = null;
                        }
                        localStorage.removeItem('kaganat_active_user');
                        localStorage.removeItem('kaganat_session_id');
                        currentActiveUser = null;
                        currentSessionId = null;

                        showModal(
                            'Сессия аяктады',
                            'Башка түзмөктөн кирүү болду! Сиздин сессияңыз жабылды.',
                            'error',
                            {},
                            () => {
                                switchScreen('login-screen');
                            }
                        );
                    }
                }
            });
        }

        async function proceedUserEntry(userData, nicknameKey) {
            currentActiveUser = nicknameKey;
            localStorage.setItem('kaganat_active_user', nicknameKey);

            // Создаем уникальный идентификатор для текущего устройства
            currentSessionId = 'sess_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('kaganat_session_id', currentSessionId);

            // Обновляем сессию в Firestore (merge: true гарантирует запись без ошибок)
            try {
                const userRef = doc(db, "nicknames", nicknameKey);
                await setDoc(userRef, { currentSessionId: currentSessionId }, { merge: true });
            } catch (err) {
                console.error("Сессия сактоо катасы:", err);
            }

            // Включаем слежку за сессией
            listenForRemoteSession(nicknameKey);

            if (userData.fraction) {
                document.getElementById('welcomePlayerTitle').innerText = `${userData.nickname}, кош келдиңиз!`;
                document.getElementById('playerFactionInfo').innerText = `Фракцияңыз: ${userData.fraction}`;
                switchScreen('game-screen');
            } else {
                switchScreen('faction-screen');
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (unsubscribeUserListener) {
                unsubscribeUserListener();
                unsubscribeUserListener = null;
            }
            localStorage.removeItem('kaganat_active_user');
            localStorage.removeItem('kaganat_session_id');
            currentActiveUser = null;
            currentSessionId = null;
            switchScreen('login-screen');
        });

        async function chooseFaction(factionName) {
            if (!currentActiveUser) return;
            try {
                const userRef = doc(db, "nicknames", currentActiveUser);
                await setDoc(userRef, { fraction: factionName }, { merge: true });

                showModal('Ийгиликтүү', `Сиз ${factionName} фракциясын тандадыңыз!`, 'success', {}, () => {
                    document.getElementById('welcomePlayerTitle').innerText = `Кош келдиңиз!`;
                    document.getElementById('playerFactionInfo').innerText = `Сиздин фракция: ${factionName}`;
                    switchScreen('game-screen');
                });
            } catch (err) {
                console.error(err);
                showModal('Ката', 'Фракцияны сактоодо ката кетти!', 'error');
            }
        }

        document.getElementById('chooseKyrgyzBtn').addEventListener('click', () => chooseFaction('Кыргыз'));
        document.getElementById('chooseKypchakBtn').addEventListener('click', () => chooseFaction('Кыпчак'));

        let progress = 0;
        const progressBar = document.getElementById('progressBar');
        const loadStatus = document.getElementById('loadStatus');

        const loadingInterval = setInterval(async () => {
            progress += 5;
            if (progress >= 100) {
                progress = 100;
                clearInterval(loadingInterval);

                const savedUser = localStorage.getItem('kaganat_active_user');
                if (savedUser) {
                    try {
                        const userRef = doc(db, "nicknames", savedUser);
                        const userSnap = await getDoc(userRef);
                        if (userSnap.exists()) {
                            proceedUserEntry(userSnap.data(), savedUser);
                            return;
                        }
                    } catch (e) {
                        console.error("Авто-кирүү катасы:", e);
                    }
                }
                switchScreen('login-screen');
            }
            progressBar.style.width = progress + '%';
            loadStatus.innerText = `Жүктөлүүдө... ${progress}%`;
        }, 30);

        document.getElementById('loginBtn').addEventListener('click', async () => {
            clearErrors();
            const nick = document.getElementById('loginNickname').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();

            let errors = {};
            if(!nick) errors['loginNickname'] = 'Ысымды жазыңыз';
            if(!pass) errors['loginPassword'] = 'Сыр сөздү жазыңыз';

            if(Object.keys(errors).length > 0) {
                showModal('Маалыматтар ката', 'Сураныч, бардык талааларды толтуруңуз!', 'error', errors);
                return;
            }

            try {
                const nicknameKey = nick.toLowerCase();
                const userDocRef = doc(db, "nicknames", nicknameKey);
                const userSnap = await getDoc(userDocRef);

                if(!userSnap.exists()) {
                    showModal('Ката', 'Мындай ысым катталган эмес!', 'error', {'loginNickname': 'Катталбаган ысым'});
                    return;
                }

                const userData = userSnap.data();
                if(userData.password !== pass) {
                    showModal('Ката', 'Сыр сөз ката жазылды!', 'error', {'loginPassword': 'Сыр сөз туура эмес'});
                    return;
                }

                showModal('Ийгиликтүү', 'Сиз оюнга ийгиликтүү кирдиңиз!', 'success', {}, () => {
                    proceedUserEntry(userData, nicknameKey);
                });
            } catch (e) {
                console.error(e);
                showModal('Ката', 'Туура эмес маалыматтарды жаздыңыз!', 'error', {'loginNickname': '', 'loginPassword': ''});
            }
        });

        document.getElementById('googleBindBtn').addEventListener('click', async () => {
            const provider = new GoogleAuthProvider();
            try {
                const result = await signInWithPopup(auth, provider);
                showModal('Ийгиликтүү', 'Google аккаунт ийгиликтүү байланды!\n' + result.user.email, 'success');
            } catch (error) {
                console.error(error);
                showModal('Ката', 'Google аркылуу кирүү ката кетти!', 'error');
            }
        });

        document.getElementById('registerSubmitBtn').addEventListener('click', async () => {
            clearErrors();
            const nick = document.getElementById('regNickname').value.trim();
            const pass1 = document.getElementById('regPassword').value;
            const pass2 = document.getElementById('regPasswordConfirm').value;

            let errors = {};
            if(!nick) errors['regNickname'] = 'Ысымды толтуруңуз';
            if(!pass1) errors['regPassword'] = 'Сыр сөздү толтуруңуз';
            if(!pass2) errors['regPasswordConfirm'] = 'Сыр сөздү кайталаңыз';

            if(Object.keys(errors).length > 0) {
                showModal('Маалыматтар ката', 'Бардык талааларды толтуруу зарыл!', 'error', errors);
                return;
            }

            if(nick.length < 3) {
                showModal('Ката', 'Ысым эң аз 3 символдон турушу керек!', 'error', {'regNickname': 'Кем дегенде 3 символ'});
                return;
            }

            const englishOnlyRegex = /^[A-Za-z0-9]+$/;
            const hasLetter = /[A-Za-z]/.test(pass1);
            const hasNumber = /[0-9]/.test(pass1);

            if (pass1.length < 8) {
                showModal('Ката', 'Сыр сөздө эң аз 8 символ болушу керек!', 'error', {'regPassword': 'Эң аз 8 символ болушу керек', 'regPasswordConfirm': ''});
                return;
            }

            if (!englishOnlyRegex.test(pass1) || !hasLetter || !hasNumber) {
                showModal('Ката', 'Сыр сөздө латын тамгалары жана сандар болушу зарыл!', 'error', {'regPassword': 'Латын тамгалары жана сандар катышыш керек', 'regPasswordConfirm': ''});
                return;
            }

            if(pass1 !== pass2) {
                showModal('Ката', 'Сыр сөздөр бири-бирине дал келбейт!', 'error', {'regPassword': 'Дал келбейт', 'regPasswordConfirm': 'Сыр сөздөр бирдей болушу шарт'});
                return;
            }

            try {
                const nicknameKey = nick.toLowerCase();
                const nickRef = doc(db, "nicknames", nicknameKey);
                const nickSnap = await getDoc(nickRef);

                if (nickSnap.exists()) {
                    showModal('Ката', 'Бул ысым буга чейин алынган!', 'error', {'regNickname': 'Бул ысым бош эмес'});
                    return;
                }

                const newUserData = { 
                    nickname: nick,
                    password: pass1,
                    fraction: null,
                    currentSessionId: null
                };

                await setDoc(nickRef, newUserData);

                showModal('Ийгиликтүү', 'Катталуу ийгиликтүү аяктады! Эми кире аласыз.', 'success', {}, () => {
                    switchScreen('login-screen');
                });

            } catch (error) {
                console.error(error);
                showModal('Ката', 'Каттоо учурунда ката кетти!', 'error');
            }
        });
    </script>
</body>
</html>
