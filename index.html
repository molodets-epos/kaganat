<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaganat - Каганат</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            margin: 0;
            background-color: #050505;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .screen {
            display: none;
            width: 380px;
            background: #111726;
            padding: 35px;
            border-radius: 14px;
            border: 2px solid #c28e38;
            box-shadow: 0 0 25px rgba(194, 142, 56, 0.2);
            text-align: center;
        }
        .screen.active {
            display: block;
        }
        /* Экран загрузки */
        #loader-screen img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }
        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: #05070a;
            border-radius: 5px;
            border: 1px solid #c28e38;
            overflow: hidden;
            margin-top: 15px;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #c28e38, #f3d078);
            transition: width 0.05s linear;
        }
        .progress-text {
            margin-top: 10px;
            font-size: 14px;
            color: #b0b0b0;
        }
        /* Формы */
        h2 {
            margin-top: 0;
            color: #f3d078;
            margin-bottom: 25px;
            font-size: 22px;
        }
        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #cfd8dc;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #080b12;
            border: 1px solid #3a475d;
            color: #fff;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }
        input:focus {
            border-color: #c28e38;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #c28e38;
            color: #080b12;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #d4a04d;
        }
        .btn-google {
            background: #ffffff;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }
        .btn-google:hover {
            background: #e0e0e0;
        }
        .switch-link {
            margin-top: 20px;
            font-size: 14px;
            color: #b0b0b0;
            cursor: pointer;
        }
        .switch-link span {
            color: #f3d078;
            text-decoration: underline;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
    </style>
</head>
<body>

    <!-- 1. ЭКРАН ЗАГРУЗКИ С ПРОЦЕНТАМИ -->
    <div id="loader-screen" class="screen active">
        <!-- Поставь имя своего логотипа, если оно отличается от logo.png -->
        <img src="logo.png" alt="Kaganat Logo" onerror="this.style.display='none'">
        <h2 style="margin-bottom:5px;">КАГАНАТ</h2>
        <div class="progress-text" id="loadStatus">Жүктөлүүдө... 0%</div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <!-- 2. ЭКРАН ВХОДА -->
    <div id="login-screen" class="screen">
        <h2>Кирүү</h2>
        <div class="input-group">
            <label>Ысым</label>
            <input type="text" id="loginNickname" placeholder="Ысымыңызды жазыңыз">
        </div>
        <div class="input-group">
            <label>Сыр сөз</label>
            <input type="password" id="loginPassword" placeholder="Сыр сөзүңүздү жазыңыз">
        </div>
        <button class="btn" id="loginBtn">Кирүү</button>
        <div class="switch-link" onclick="switchScreen('register-screen')">
            Аккаунт жокпу? <span style="font-weight: bold;">Катталуу</span>
        </div>
    </div>

    <!-- 3. ЭКРАН КАТТАЛУУ (РЕГИСТРАЦИИ) -->
    <div id="register-screen" class="screen">
        <h2>Катталуу</h2>
        <div class="input-group">
            <label>Ысым ойлоп табыңыз</label>
            <input type="text" id="regNickname" placeholder="Уникалдуу ысым">
        </div>
        <div class="input-group">
            <label>Сыр сөз ойлоп табыңыз</label>
            <input type="password" id="regPassword" placeholder="Сыр сөз">
        </div>
        <div class="input-group">
            <label>Сыр сөзүңүздү кайталап жазыңыз</label>
            <input type="password" id="regPasswordConfirm" placeholder="Сыр сөздү кайталаңыз">
        </div>
        
        <button class="btn btn-google" id="googleBindBtn">
            <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.86 2.07-1.83 2.71v2.26h2.96c1.73-1.59 2.73-3.93 2.73-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.96-2.26c-.8.54-1.82.87-3 .87-2.3 0-4.25-1.55-4.95-3.64H1.02v2.33C2.55 15.96 5.54 18 9 18z"/><path fill="#FBBC05" d="M4.05 10.79c-.18-.54-.28-1.12-.28-1.79s.1-1.25.28-1.79V4.88H1.02C.37 6.18 0 7.65 0 9.2s.37 3.02 1.02 4.32l3.03-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.47.89 11.43 0 9 0 5.54 0 2.55 2.04 1.02 4.88l3.03 2.33c.7-2.09 2.65-3.63 4.95-3.63z"/></svg>
            Google аккаунтту байлоо
        </button>

        <button class="btn" id="registerSubmitBtn" style="margin-top: 15px;">Катталууну аяктоо</button>
        
        <div class="switch-link" onclick="switchScreen('login-screen')">
            Мурунтан аккаунтуңуз барбы? <span style="font-weight: bold;">Кирүү</span>
        </div>
    </div>

    <script>
        // Функция переключения между экранами входа и регистрации
        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // Анимация экрана загрузки (от 0% до 100%)
        let progress = 0;
        const progressBar = document.getElementById('progressBar');
        const loadStatus = document.getElementById('loadStatus');

        const loadingInterval = setInterval(() => {
            progress += 2; // скорость заполнения
            if (progress >= 100) {
                progress = 100;
                clearInterval(loadingInterval);
                // После окончания загрузки автоматически открываем экран входа
                setTimeout(() => {
                    switchScreen('login-screen');
                }, 300);
            }
            progressBar.style.width = progress + '%';
            loadStatus.innerText = `Жүктөлүүдө... ${progress}%`;
        }, 30);

        // Кнопки взаимодействия
        document.getElementById('loginBtn').addEventListener('click', () => {
            const nick = document.getElementById('loginNickname').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();
            if(!nick || !pass) {
                alert('Сураныч, бардык талааларды толтуруңуз!');
                return;
            }
            alert('Кирүү аракет кылынууда...');
        });

        document.getElementById('googleBindBtn').addEventListener('click', () => {
            alert('Google аккаунтту байлоо баскычы басылды...');
        });

        document.getElementById('registerSubmitBtn').addEventListener('click', () => {
            const nick = document.getElementById('regNickname').value.trim();
            const pass1 = document.getElementById('regPassword').value;
            const pass2 = document.getElementById('regPasswordConfirm').value;

            if(!nick || !pass1 || !pass2) {
                alert('Сураныч, бардык талааларды толтуруңуз!');
                return;
            }
            if(pass1 !== pass2) {
                alert('Ката: Сыр сөздөр бири-бирине дал келбейт!');
                return;
            }
            alert('Катталуу ийгиликтүү башталды!');
        });
    </script>
</body>
</html>
