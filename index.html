<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каганат</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0f19;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            background: #131a2a;
            padding: 30px;
            border-radius: 12px;
            border: 2px solid #c28e38;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            width: 320px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #0b0f19;
            border: 1px solid #c28e38;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #8b4513;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #a0522d;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Экран регистрации -->
    <div id="registerScreen" class="container">
        <h2>Регистрация в Каганате</h2>
        <input type="text" id="nicknameInput" placeholder="Введите ваш позывной">
        <button id="registerBtn">Войти в игру</button>
    </div>

    <!-- Игровой экран (скрыт до регистрации) -->
    <div id="gameScreen" class="container hidden">
        <h2>Баатырдын жолу</h2>
        <p>Баатыр өз жолун башташ үчүн узак жолго аттанды. Жолдо жүрүп катуу борон башталды, караңғылык каптады...</p>
        <button id="nextBtn">Кийинки ➔</button>
    </div>

    <!-- Скрипт логики -->
    <script type="module" src="register.js"></script>
</body>
</html>
